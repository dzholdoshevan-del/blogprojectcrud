{% extends 'crud/base.html' %}
{% block title %}{% if object %}Изменить{% else %}Добавить{% endif %}{% endblock %}
{% block content %}
  <h1>{% if object %}Изменить запись{% else %}Новая запись{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'crud:list' %}">Отмена</a>
  </form>
{% endblock %}
